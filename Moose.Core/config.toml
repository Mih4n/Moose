# Moose — default configuration
# Copied to $XDG_CONFIG_HOME/moose/config.toml (or ~/.config/moose/config.toml) on first run.

# Split the configuration across files. Paths are relative to this file, `*` matches file names,
# missing files are skipped. Included files load first and this file overrides them key by key;
# [[keybindings]] from every file are combined, and the last binding for a chord wins.
# include = ["keybindings.toml", "conf.d/*.toml"]

[shell]
# Empty = use $SHELL
program = ""
args = []
working_directory = ""   # empty = $HOME

[shell.env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[font]
family = "JetBrainsMonoNL Nerd Font"
size = 11.0              # points, like kitty/alacritty (1pt = 96/72 logical px)
line_height = 1.0
ligatures = true

[window]
title = "Moose"
dynamic_title = true     # let the shell change the title via OSC 0/2
columns = 120
rows = 35
padding_x = 12
padding_y = 8
opacity = 1.0
decorations = true
confirm_close = false

[cursor]
style = "beam"           # block | beam | underline
blink = true
blink_interval_ms = 500

[scrollback]
lines = 10000
multiplier = 3           # lines per mouse-wheel step

[mouse]
hide_when_typing = true
copy_on_select = false
open_urls = true

[bell]
audible = false
visual = false

# Gruvbox VSCode Dark Medium (Zed theme terminal colors)
[colors]
foreground = "#ebdbb2"
background = "#282828"
cursor = "#ebdbb2"
cursor_text = "#282828"
selection_foreground = "#ebdbb2"
selection_background = "#504945"

[colors.normal]
black   = "#3c3836"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

# UI chrome (tab bar etc.). Hex "#rrggbb" or "#rrggbbaa".
[ui.colors]
background     = "#282828"
panel          = "#282828"
border         = "#3c3836"
border_variant = "#504945"
hover          = "#3c383680"
selected       = "#3c3836"
text           = "#ebdbb2"
text_muted     = "#bdae93"
debug_bounds   = "#ff00ff"   # outline color when [debug] bounds = true

# Built-in bindings always apply; add your own to override them, or use action = "none" to pass a chord to the shell.
# Actions: command_palette, copy, paste, new_tab, close_tab, next_tab, previous_tab, new_window,
# scroll_line_up, scroll_line_down, scroll_page_up, scroll_page_down, scroll_to_top, scroll_to_bottom,
# font_size_increase, font_size_decrease, font_size_reset, reload_config, none

[[keybindings]]
keys = "ctrl+shift+p"
action = "command_palette"

[[keybindings]]
keys = "ctrl+shift+c"
action = "copy"

[[keybindings]]
keys = "ctrl+shift+v"
action = "paste"

[[keybindings]]
keys = "ctrl+shift+equal"
action = "font_size_increase"

[[keybindings]]
keys = "ctrl+shift+minus"
action = "font_size_decrease"

[[keybindings]]
keys = "ctrl+shift+0"
action = "font_size_reset"

[[keybindings]]
keys = "shift+page_up"
action = "scroll_page_up"

[[keybindings]]
keys = "shift+page_down"
action = "scroll_page_down"

[[keybindings]]
keys = "ctrl+shift+k"
action = "scroll_line_up"

[[keybindings]]
keys = "ctrl+shift+j"
action = "scroll_line_down"

[[keybindings]]
keys = "ctrl+shift+home"
action = "scroll_to_top"

[[keybindings]]
keys = "ctrl+shift+end"
action = "scroll_to_bottom"

[[keybindings]]
keys = "ctrl+shift+t"
action = "new_tab"

[[keybindings]]
keys = "ctrl+shift+w"
action = "close_tab"

[[keybindings]]
keys = "ctrl+shift+l"
action = "next_tab"

[[keybindings]]
keys = "ctrl+shift+h"
action = "previous_tab"

[[keybindings]]
keys = "ctrl+tab"
action = "next_tab"

[[keybindings]]
keys = "ctrl+shift+tab"
action = "previous_tab"

[[keybindings]]
keys = "ctrl+shift+n"
action = "new_window"

[[keybindings]]
keys = "ctrl+shift+f5"
action = "reload_config"
